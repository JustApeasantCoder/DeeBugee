[workspace]
members = [
    "crates/toolkit-core",
    "crates/toolkit-rust",
    "crates/toolkit-schema",
    "crates/toolkit-viewer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JustApeasantCoder/Debug-Logging-Toolkit"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["serde"] }
roaring = "0.11"
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
